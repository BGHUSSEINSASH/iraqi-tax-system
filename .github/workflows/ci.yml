name: Commercial CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: commercial-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend smoke test
        working-directory: backend
        run: node -e "import('./src/server.js').then(()=>console.log('backend ok')).catch(err=>{console.error(err);process.exit(1)})"

  frontend-check:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-guard:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [ backend-check, frontend-check ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required security files exist
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f COMMERCIAL_LICENSE.md
          test -f COPYRIGHT_NOTICE.txt
          echo "Security files verified"

      - name: Check for committed secrets placeholders
        run: |
          if grep -R "JWT_SECRET=\|PRIVATE_KEY\|BEGIN PRIVATE KEY\|sk_live\|AKIA" -n backend frontend . || true; then
            echo "Sensitive secret pattern found in repository. Review before merge." >&2
            exit 1
          fi
          echo "No obvious secrets detected"
